version: '3.8'

services:
  # Zookeeper для Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ref-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - ref-network

  # Kafka UI для мониторинга
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    networks:
      - ref-network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: inskins-referral
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ref-network

  # Referral Service
  referral-service:
    build: .
    container_name: referral-service
    depends_on:
      - kafka
      - mongodb
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: referral-service-consumer
      KAFKA_CLIENT_ID: referral-service
      MONGODB_URI: mongodb://root:password123@mongodb:27017/inskins-referral?authSource=admin
      FRONTEND_URL: https://inskins.gg
      REFERRAL_COMMISSION_RATE: "0.015"
      REFERRAL_MAX_COMMISSION_RATE: "0.1"
      REFERRAL_MIN_TRANSACTION_AMOUNT: "100"
    ports:
      - "3003:3000"
    networks:
      - ref-network

volumes:
  mongodb_data:

networks:
  ref-network:
    driver: bridge 